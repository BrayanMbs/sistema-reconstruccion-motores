services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-motores_db}
      POSTGRES_USER: ${POSTGRES_USER:-motores_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-motores_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/migrations/001_issue_1_admin.sql:/docker-entrypoint-initdb.d/001_issue_1_admin.sql:ro
      - ./backend/database/migrations/002_admin_operations.sql:/docker-entrypoint-initdb.d/002_admin_operations.sql:ro
      - ./backend/database/migrations/003_operational_workflow.sql:/docker-entrypoint-initdb.d/003_operational_workflow.sql:ro
      - ./backend/database/migrations/004_seed_admin.sql:/docker-entrypoint-initdb.d/004_seed_admin.sql:ro
      - ./backend/database/migrations/005_public_order_tracking.sql:/docker-entrypoint-initdb.d/005_public_order_tracking.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - motores-network

  backend:
    build:
      context: ./backend
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-motores_db}
      DB_USER: ${POSTGRES_USER:-motores_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-motores_password}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - motores-network

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8080}
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8080}
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started
    networks:
      - motores-network

volumes:
  postgres_data:

networks:
  motores-network:
    name: motores-network
