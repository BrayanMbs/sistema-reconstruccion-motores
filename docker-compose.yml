services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-}
      DB_SSL: ${DB_SSL:-true}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-false}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      CLOUD_DATABASE_REQUIRED: "true"
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - motores-network

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8080}
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8080}
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started
    networks:
      - motores-network

networks:
  motores-network:
    name: motores-network
